       <div class="contactform">
        <form>
            <fieldset><legend>Contact Us</legend>
                <label for="fname" >First Name</label>  
                <input type="text" id="fname" placeholder="Enter First Name" >
                <br><br>

                <label for="lname">Last Name</label>
                <input type="text" id="lname" placeholder="Enter Last Name">
                <br><br>

                <label for="myemail">Email</label>
                <input type="email" name="myemail" size="12" placeholder="Enter Email">
                <br><br>

                <label for="message">Enter Message</label><br>
                <textarea cols="50" rows="15" name="message" style="font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif "  placeholder="Reason for reaching out"></textarea>
                <br><br>

                <button type="button">Submit</button>
            </fieldset>
        </form>
